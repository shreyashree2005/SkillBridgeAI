# Render Blueprint (https://render.com/docs/blueprint-spec) for SkillBridge AI.
# Creates the API server, the AI service and the static frontend.
# Secrets marked `sync: false` are entered in the Render dashboard — never committed.
services:
  - type: web
    name: skillbridge-ai-service
    runtime: python
    region: singapore
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: AI_SERVICE_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: skillbridge-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_KEY
        fromService:
          type: web
          name: skillbridge-ai-service
          envVarKey: AI_SERVICE_KEY
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_TIMEOUT_MS
        value: "90000"
      - key: CLIENT_URL
        sync: false

  - type: web
    name: skillbridge-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
